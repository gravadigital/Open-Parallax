name: CI

on:
  push:
    branches: [main, dev]
    # Un cambio sólo de documentación no necesita la suite. El propio workflow
    # queda fuera de la lista a propósito: editar el CI tiene que correr el CI.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  # dev-images.yml y release.yml reutilizan esta misma suite con `uses:`, así los
  # tres workflows corren exactamente los mismos pasos y no hay tres copias que
  # mantener en sintonía.
  workflow_call:

# Una corrida por rama: si llegan pushes seguidos, el anterior se cancela. El grupo
# incluye el workflow que llama, porque este archivo también corre reusado desde
# dev-images.yml y release.yml: sin eso, un push a dev cancelaría la suite de la
# publicación que ya está en curso.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow == 'CI' }}

# Go y Node son toolchains distintas, con caches y setup propios: son dos jobs que
# corren en paralelo, y un rojo en web no oculta el estado de api. Cada job corre los
# mismos targets de make que se corren en local (la parte rápida de `make check`); los
# tests end to end corren solo en local (ver _jflow/prd/architecture/testing.md).
jobs:
  api:
    name: api (Go)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - name: Versions agree across the monorepo
        run: ./scripts/set-version.sh --check

      - name: Lint and typecheck
        run: make lint typecheck S=api

      # Los unitarios no tocan base ni red. Los de integración corren contra el
      # PostgreSQL de docker-compose.yml, con las migraciones aplicadas; el de S3
      # levanta su propio Garage con testcontainers.
      - name: Unit and integration tests
        run: make test-unit test-integration S=api

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-api
          path: reports/junit/
          if-no-files-found: ignore

  web:
    name: web (React)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: services/web/.nvmrc
          cache: npm
          cache-dependency-path: |
            services/web/package-lock.json
            services/web/e2e/package-lock.json

      - name: Lint and typecheck
        run: make lint typecheck S=web

      - name: Unit tests
        run: make test-unit test-integration S=web

      # Construye la imagen, que compila el bundle con `npm run build`.
      - name: Build
        run: make build S=web

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-web
          path: reports/junit/
          if-no-files-found: ignore
