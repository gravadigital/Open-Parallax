# Levanta Telescope completo en esta máquina, construyendo desde el repo:
#
#   docker compose up -d --build
#
# No necesita ningún .env: cada variable trae su default acá. Para cambiar algo
# (el login con Google, un puerto que choca) se crea deploy/.env, que docker compose
# lee solo. Las variables disponibles están en README.md.
#
# Es sólo para desarrollo: los secretos por defecto son públicos y los puertos quedan
# expuestos en localhost. El deploy a un servidor vive en el repo de deploy.
name: telescope-local

volumes:
  database:
  garage-meta:
  garage-data:

services:
  database:
    image: postgres:15-alpine
    container_name: telescope-local-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telescope_db}
      POSTGRES_USER: ${POSTGRES_USER:-telescope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telescope_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      # $$ para que lo expanda el contenedor con sus propias variables, no compose.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Almacenamiento de objetos S3 (propuestas). Con --single-node arma solo el layout, y con
  # --default-bucket crea la clave de la api y el bucket al arrancar, en forma idempotente:
  # cuando /health responde, el bucket ya existe. La api no lo crea (en Garage quedaría con
  # alias local) y no hay contenedor de init porque el bucket es privado.
  #
  # La imagen no trae shell, curl ni wget: el healthcheck usa el propio binario.
  garage:
    image: dxflrs/garage:v2.4.1
    container_name: telescope-local-garage
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-4b1d2f8e0c7a9b3e5d6f1a2c4e8b0d7f9a1c3e5b7d9f0a2c4e6b8d0f2a4c6e8b}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-telescope-local-admin-token}
      # ID: >= 8 caracteres [A-Za-z0-9-_.]; nunca se reutiliza, ni después de borrarlo.
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-GKtelescopelocal01}
      # Secreto: >= 16 caracteres. Cambiarlo con el volumen ya creado impide arrancar
      # (no coincide con la clave existente): `make reset` lo resuelve en local.
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-telescope-local-secret-0123456789}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-telescope}
    ports:
      - "${GARAGE_S3_PORT:-3900}:3900"   # API S3; el 3903 (admin) queda en la red interna
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "health", "-q"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: telescope-local-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-telescope}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-telescope_password}
      DB_NAME: ${POSTGRES_DB:-telescope_db}
      DB_SSLMODE: disable
      PORT: 8080
      GIN_MODE: ${GIN_MODE:-release}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10485760}
      # Default fijo a propósito: este compose es sólo local y los tokens que firma
      # sólo valen contra esta misma base. En un servidor, JWT_SECRET se define siempre.
      JWT_SECRET: ${JWT_SECRET:-telescope-local-dev-secret-no-usar-en-produccion}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
      FRONTEND_URL: http://localhost:${WEB_PORT:-3000}
      STORAGE_PROVIDER: s3
      S3_ENDPOINT: http://garage:3900
      S3_REGION: garage
      S3_BUCKET: ${S3_BUCKET:-telescope}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-GKtelescopelocal01}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-telescope-local-secret-0123456789}
      # Host con el que se firman las URLs prefirmadas: el que ve el navegador.
      S3_PRESIGN_ENDPOINT: http://localhost:${GARAGE_S3_PORT:-3900}
      # Vacío = sólo login con email y contraseña.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Con EMAIL_ENABLED=false no se manda ningún mail (recuperación de contraseña,
      # avisos de cambio de etapa).
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Telescope}
    depends_on:
      database:
        condition: service_healthy
      garage:
        condition: service_healthy

  # La configuración entra al arrancar, no al construir: el contenedor la escribe en
  # config.js (web/docker/40-runtime-config.sh). Cambiarla sólo pide recrear el
  # contenedor, no reconstruir la imagen.
  web:
    build:
      context: ../web
      dockerfile: docker/Dockerfile
    container_name: telescope-local-web
    restart: unless-stopped
    environment:
      # Como la ve el navegador, no el contenedor: nunca http://api:8080.
      API_URL: http://localhost:${API_PORT:-8080}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api

  # Opcional: docker compose --profile tools up -d pgadmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: telescope-local-pgadmin
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    profiles:
      - tools
