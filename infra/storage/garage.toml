# Garage de un solo nodo, para desarrollo (servicio storage del compose). rpc_secret y admin_token entran por variables
# de entorno (GARAGE_RPC_SECRET, GARAGE_ADMIN_TOKEN) desde docker-compose.yml.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"          # en un solo nodo resiste mejor que lmdb un corte de luz
replication_factor = 1        # lo exige --single-node; no hay redundancia

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"          # la api firma con S3_REGION, que tiene que coincidir
api_bind_addr = "[::]:3900"

# El bucket de propuestas es privado: la api las sirve ella misma, así que no hay
# sección [s3_web] ni bucket en modo website.

[admin]
api_bind_addr = "[::]:3903"   # /health y administración; no se publica en el host
